# Pushing a vX.Y.Z tag builds both releases and drafts a GitHub release with them; publishing
# the draft is what makes installed copies update. Every push to master also drafts a
# development build (dev-<commit>, a prerelease, version 0.0.0-dev: never offered as an update).
# Run it by hand (Actions > Release > Run workflow) to only build and download the files from
# the run's artifacts.
name: Release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Oldest supported runner (glibc 2.35): the AppImage runs there and on anything newer.
          - target: linux
            runner: ubuntu-22.04
          # The exe does not depend on glibc; vgmstream needs a newer mingw GCC than 22.04's.
          - target: windows
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install the Windows cross compiler
        if: matrix.target == 'windows'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64 ninja-build

      - name: Install bgfx's Linux build headers
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libx11-dev libgl-dev libwayland-dev

      - name: Build
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export WADDAMBURO_VERSION=${GITHUB_REF_NAME#v}; fi
          eng/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          # Each job produces its own subset (licenses.zip comes with the Linux build).
          path: |
            out/package/Waddamburo.exe
            out/package/Waddamburo-x86_64.AppImage
            out/package/licenses.zip

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
            flags=()
          else
            # The tag is only created on the commit if the draft is published.
            tag=dev-${GITHUB_SHA::7}
            flags=(--prerelease --target "$GITHUB_SHA")
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --generate-notes "${flags[@]}" \
            --title "Waddamburo $tag" Waddamburo.exe Waddamburo-x86_64.AppImage licenses.zip

# Pushing a vX.Y.Z tag builds the four releases (Windows, Linux, Android, Switch homebrew) and drafts a GitHub release with them; publishing
# the draft is what makes installed copies update. Run it by hand (Actions > Release > Run
# workflow) to only build and download the files from the run's artifacts, or with "nightly" ticked
# to publish a nightly: version X.Y.Z-nightly (X.Y.Z the latest stable release), tagged with the short
# commit, a pre-release that installed nightlies update to (stable builds ignore it).
name: Release

on:
  push:
    tags: ['v*']
    # A tag's run only reads caches saved on master (or the tag itself): master keeps the native libraries' cache
    # (below) up to date whenever they change.
    branches: [master]
    paths: ['native/**', 'platforms/switch/**', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      nightly:
        description: Publish a nightly pre-release
        type: boolean
        default: false

permissions:
  contents: write
  packages: read # the toolchain images

jobs:
  # The version stamped into both builds: the tag's, a nightly's, or none (a development build).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: ${{ inputs.nightly }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [ "$NIGHTLY" = true ]; then
            stable=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
            echo "version=${stable#v}-nightly" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux and windows build in their toolchain image (eng/ci/Dockerfile, ci-image.yml): no package mirror at
          # release time. linux: Ubuntu 22.04 (glibc 2.35), the AppImage runs there and on anything newer. windows:
          # Ubuntu 24.04's mingw (vgmstream needs a newer mingw GCC than 22.04's); the exe does not depend on glibc.
          - target: linux
            runner: ubuntu-24.04
            image: linux
          - target: windows
            runner: ubuntu-24.04
            image: windows
          # Android stays on the runner (its SDK is there); ninja comes from PyPI.
          - target: android
            runner: ubuntu-24.04
          # The Switch homebrew also stays on the runner: platforms/switch/build.sh runs its devkitA64 steps in the
          # pinned devkitpro/devkita64 image through the runner's Docker.
          - target: switch
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    # No image (android): no container, the job runs on the runner.
    container:
      image: ${{ matrix.image && format('ghcr.io/lucasilva-r/waddamburo-build:{0}', matrix.image) || '' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # The native libraries (ffmpeg, vgmstream, freetype, bgfx) take most of the build: their downloaded sources
      # and build tree are kept until anything under native/ (or the toolchain image) changes.
      - uses: actions/cache@v4
        with:
          path: |
            out/downloads/ffmpeg-*.tar.xz
            out/downloads/opus-*.tar.gz
            out/source
            out/build/native
          key: native-${{ matrix.target }}-${{ matrix.runner }}-${{ hashFiles('native/**', 'eng/ci/Dockerfile') }}

      # The Switch's native libraries and bgfx (built for libnx from the pinned sources), until platforms/switch or
      # native/ change.
      - uses: actions/cache@v4
        if: matrix.target == 'switch'
        with:
          path: |
            out/downloads
            out/switch/ext
            out/switch/natives
            out/switch/bgfx
          key: switch-native-${{ hashFiles('native/**', 'platforms/switch/scripts/**', 'platforms/switch/patches/**', 'platforms/switch/build.sh') }}

      # Android: JDK 21 (the runner's default Java is newer than the Android build tools take), the pinned NDK
      # (kept between runs) and .NET's Android workload.
      - uses: actions/setup-java@v5
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v4
        if: matrix.target == 'android'
        id: ndk
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          key: android-ndk-29.0.14206865

      - name: Install the Android NDK and workload
        if: matrix.target == 'android'
        run: |
          if [ "${{ steps.ndk.outputs.cache-hit }}" != true ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;29.0.14206865" > /dev/null
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          pipx install ninja
          dotnet workload install android

      # The release key (Android installs an update only when it carries the same one): a base64 .jks in the
      # ANDROID_KEYSTORE secret, its password in ANDROID_KEYSTORE_PASSWORD. Without them the APK is debug-signed.
      - name: Unpack the Android release key
        if: matrix.target == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/waddamburo.jks"
            echo "WADDAMBURO_ANDROID_KEYSTORE=$RUNNER_TEMP/waddamburo.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          WADDAMBURO_VERSION: ${{ needs.version.outputs.version }}
          WADDAMBURO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: eng/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          # The common notices and source archives come from the Linux build.
          path: |
            out/package/Waddamburo.exe
            out/package/Waddamburo-x86_64.AppImage
            out/package/Waddamburo.apk
            out/package/Waddamburo.nro
            out/package/licenses.zip
            out/package/licenses-switch.zip
            out/package/licenses-win-x64.zip
            out/package/native-*.zip
            out/package/ffmpeg-source.zip
            out/package/ffmpeg-relink-*.zip

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(Waddamburo.exe Waddamburo-x86_64.AppImage Waddamburo.apk Waddamburo.nro licenses.zip licenses-win-x64.zip
            licenses-switch.zip native-*.zip ffmpeg-source.zip ffmpeg-relink-linux-x64.zip ffmpeg-relink-win-x64.zip
            ffmpeg-relink-android-arm64.zip ffmpeg-relink-android-x64.zip ffmpeg-relink-switch.zip)
          if draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [ "$draft" != true ]; then
              echo "Release $GITHUB_REF_NAME has already been published."
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
              --notes "Waddamburo uses FFmpeg under the LGPL 2.1 or later. Download ffmpeg-source.zip and the ffmpeg-relink archive for your platform. [Relinking instructions](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/development/ffmpeg.md#relinking-a-release)." \
              --title "Waddamburo $GITHUB_REF_NAME" "${assets[@]}"
          fi

  nightly:
    if: github.ref_type != 'tag' && inputs.nightly
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      # Published at once (installed nightlies update to it); the tag is made on the commit built. The files are
      # named apart so a nightly sits beside the stable build (it keeps its own waddamburo-nightly folder too).
      - name: Publish the nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv Waddamburo.exe Waddamburo-nightly.exe
          mv Waddamburo-x86_64.AppImage Waddamburo-nightly-x86_64.AppImage
          mv Waddamburo.apk Waddamburo-nightly.apk
          mv Waddamburo.nro Waddamburo-nightly.nro
          gh release create "${GITHUB_SHA::7}" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --generate-notes \
            --title "Waddamburo nightly ${GITHUB_SHA::7}" Waddamburo-nightly.exe Waddamburo-nightly-x86_64.AppImage Waddamburo-nightly.apk Waddamburo-nightly.nro \
            --notes "Waddamburo uses FFmpeg under the LGPL 2.1 or later. Download ffmpeg-source.zip and the ffmpeg-relink archive for your platform. [Relinking instructions](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/development/ffmpeg.md#relinking-a-release)." \
            licenses.zip licenses-win-x64.zip native-*.zip ffmpeg-source.zip ffmpeg-relink-linux-x64.zip ffmpeg-relink-win-x64.zip \
            ffmpeg-relink-android-arm64.zip ffmpeg-relink-android-x64.zip licenses-switch.zip ffmpeg-relink-switch.zip

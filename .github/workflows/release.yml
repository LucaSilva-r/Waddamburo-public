# Pushing a vX.Y.Z tag builds both releases and drafts a GitHub release with them; publishing
# the draft is what makes installed copies update. Run it by hand (Actions > Release > Run
# workflow) to only build and download the files from the run's artifacts, or with "nightly" ticked
# to publish a nightly: version X.Y.Z-nightly (X.Y.Z the latest stable release), tagged with the short
# commit, a pre-release that installed nightlies update to (stable builds ignore it).
name: Release

on:
  push:
    tags: ['v*']
    # A tag's run only reads caches saved on master (or the tag itself): master keeps the native libraries' cache
    # (below) up to date whenever they change.
    branches: [master]
    paths: ['native/**', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      nightly:
        description: Publish a nightly pre-release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # The version stamped into both builds: the tag's, a nightly's, or none (a development build).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: ${{ inputs.nightly }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [ "$NIGHTLY" = true ]; then
            stable=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
            echo "version=${stable#v}-nightly" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    strategy:
      matrix:
        include:
          # Oldest supported runner (glibc 2.35): the AppImage runs there and on anything newer.
          - target: linux
            runner: ubuntu-22.04
          # The exe does not depend on glibc; vgmstream needs a newer mingw GCC than 22.04's.
          - target: windows
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # The native libraries (ffmpeg, vgmstream, freetype, bgfx) take most of the build: their downloaded sources
      # and build tree are kept until anything under native/ changes.
      - uses: actions/cache@v4
        with:
          path: |
            out/source
            out/build/native
          key: native-${{ matrix.target }}-${{ matrix.runner }}-${{ hashFiles('native/**') }}

      - name: Install the Windows cross compiler
        if: matrix.target == 'windows'
        # A stuck Ubuntu mirror once held a release for minutes: fail, and run the job again.
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64 ninja-build

      - name: Install bgfx's Linux build headers
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libx11-dev libgl-dev libwayland-dev

      - name: Build
        env:
          WADDAMBURO_VERSION: ${{ needs.version.outputs.version }}
        run: eng/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          # Each job produces its own subset (licenses.zip comes with the Linux build).
          path: |
            out/package/Waddamburo.exe
            out/package/Waddamburo-x86_64.AppImage
            out/package/licenses.zip
            out/package/native-*.zip

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes
          --title "Waddamburo $GITHUB_REF_NAME" Waddamburo.exe Waddamburo-x86_64.AppImage licenses.zip native-*.zip

  nightly:
    if: github.ref_type != 'tag' && inputs.nightly
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      # Published at once (installed nightlies update to it); the tag is made on the commit built.
      - name: Publish the nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_SHA::7}" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --generate-notes
          --title "Waddamburo nightly ${GITHUB_SHA::7}" Waddamburo.exe Waddamburo-x86_64.AppImage licenses.zip native-*.zip
